 Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">Mistral Medium 3.5 · orchestrator</text><text x="730.0" y="1266.0" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">(coordinator, not creator) · Postgres memory</text><line x1="710" y1="1050" x2="710" y2="1170" stroke="#251f12" stroke-width="2.5" marker-end="url(#arrowhead)"/><rect x="230" y="1330" width="320" height="110" rx="14" fill="#FFFBF1" stroke="#251f12" stroke-width="2.5"/><text x="390.0" y="1370.1399999999999" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="18" fill="#251f12" text-anchor="middle">Generator Agent</text><text x="390.0" y="1392.6399999999999" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="18" fill="#251f12" text-anchor="middle">"The Writer"</text><text x="390.0" y="1411.0" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">Claude Sonnet 4.6 (Bedrock)</text><text x="390.0" y="1426.0" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">drafts subject + body</text><rect x="940" y="1330" width="320" height="110" rx="14" fill="#FFFBF1" stroke="#251f12" stroke-width="2.5"/><text x="1100.0" y="1370.1399999999999" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="18" fill="#251f12" text-anchor="middle">Critic Agent</text><text x="1100.0" y="1392.6399999999999" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="18" fill="#251f12" text-anchor="middle">"The Judge"</text><text x="1100.0" y="1411.0" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">Gemini 3.5 Flash (Vertex)</text><text x="1100.0" y="1426.0" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">6-dimension SMYKM rubric</text><path d="M 600 1280 Q 500 1300 420 1330" fill="none" stroke="#E17100" stroke-width="2.5" marker-end="url(#arr