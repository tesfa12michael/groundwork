<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1250" width="1500" height="1250" font-family="Manrope, sans-serif"><rect x="0" y="0" width="1500" height="1250" fill="#FFFBF1"/><defs>
