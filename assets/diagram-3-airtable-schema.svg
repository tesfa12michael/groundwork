</defs><text x="750.0" y="55.0" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="28" fill="#251f12" text-anchor="middle">AIRTABLE DATA MODEL</text><text x="750.0" y="86.0" font-family="Manrope, sans-serif" font-weight="500" font-size="14" fill="#5c5439" text-anchor="middle" font-style="italic">Groundwork data layer — three Airtable tables, one shared key</text><rect x="80" y="150" width="430" height="552" rx="14" fill="#FFFBF1" stroke="#251f12" stroke-width="2.5"/><path d="M 80 164 q 0 -14 14 -14 h 402 q 14 0 14 14 v 48 h -430 Z" fill="#251f12"/><text x="295.0" y="180" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="19" fill="#FFFBF1" text-anchor="middle">Lead_Profiles</text><text x="295.0" y="200" font-family="Manrope, sans-serif" font-size="12" fill="#FFFBF1" text-anchor="middle" opacity="0.85">written once, right after sourcing — durable identity record</text><rect x="88" y="216" width="414" height="28" rx="6" fill="#E17100" opacity="0.13"/><text x="100" y="234" font-family="JetBrains Mono, monospace" font-weight="700" font-size="13.5" fill="#E17100" text-anchor="start">lead_id</text><text x="490" y="234" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">text — PK</text><line x1="94" y1="246" x2="496" y2="246" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="100" y="268" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">first_name</text><text x="490" y="268" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">text</text><line x1="94" y1="280" x2="496" y2="280" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="100" y="302" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">last_name</text><text x="490" y="302" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">text</text><line x1="94" y1="314" x2="496" y2="314" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="100" y="336" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">email</text><text x="490" y="336" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">email</text><line x1="94" y1="348" x2="496" y2="348" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="100" y="370" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">linkedin_url</text><text x="490" y="370" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">url</text><line x1="94" y1="382" x2="496" y2="382" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="100" y="404" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">headline</text><text x="490" y="404" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">long text</text><line x1="94" y1="416" x2="496" y2="416" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="100" y="438" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">title</text><text x="490" y="438" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">text</text><line x1="94" y1="450" x2="496" y2="450" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="100" y="472" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">sanitized_address</text><text x="490" y="472" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">text</text><line x1="94" y1="484" x2="496" y2="484" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="100" y="506" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">organization_name</text><text x="490" y="506" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">text</text><line x1="94" y1="518" x2="496" y2="518" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="100" y="540" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">organization_primary_domain</text><text x="490" y="540" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">text</text><line x1="94" y1="552" x2="496" y2="552" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="100" y="574" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">organization_linkedin_url</text><text x="490" y="574" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">url</text><line x1="94" y1="586" x2="496" y2="586" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="100" y="608" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">organization_founded_year</text><text x="490" y="608" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">number</text><line x1="94" y1="620" x2="496" y2="620" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="100" y="642" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">run_id</text><text x="490" y="642" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">text</text><line x1="94" y1="654" x2="496" y2="654" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="100" y="676" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">sourced_at</text><text x="490" y="676" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">datetime</text><rect x="560" y="150" width="430" height="484" rx="14" fill="#FFFBF1" stroke="#251f12" stroke-width="2.5"/><path d="M 560 164 q 0 -14 14 -14 h 402 q 14 0 14 14 v 48 h -430 Z" fill="#E17100"/><text x="775.0" y="180" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="19" fill="#251f12" text-anchor="middle">Leads</text><text x="775.0" y="200" font-family="Manrope, sans-serif" font-size="12" fill="#251f12" text-anchor="middle" opacity="0.85">pipeline state / checkpoint — one row per lead, read on every run start</text><rect x="568" y="216" width="414" height="28" rx="6" fill="#E17100" opacity="0.13"/><text x="580" y="234" font-family="JetBrains Mono, monospace" font-weight="700" font-size="13.5" fill="#E17100" text-anchor="start">lead_id</text><text x="970" y="234" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">text — PK</text><line x1="574" y1="246" x2="976" y2="246" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="580" y="268" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">pipeline_status</text><text x="970" y="268" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">single select</text><line x1="574" y1="280" x2="976" y2="280" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="580" y="302" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">run_id</text><text x="970" y="302" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">text</text><line x1="574" y1="314" x2="976" y2="314" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="580" y="336" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">final_subject</text><text x="970" y="336" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">text</text><line x1="574" y1="348" x2="976" y2="348" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="580" y="370" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">final_body</text><text x="970" y="370" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">long text</text><line x1="574" y1="382" x2="976" y2="382" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="580" y="404" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">critic_score_json</text><text x="970" y="404" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">long text</text><line x1="574" y1="416" x2="976" y2="416" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="580" y="438" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">error_log</text><text x="970" y="438" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">long text</text><line x1="574" y1="450" x2="976" y2="450" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="580" y="472" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">retry_count</text><text x="970" y="472" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">number</text><line x1="574" y1="484" x2="976" y2="484" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="580" y="506" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">personalization_tier</text><text x="970" y="506" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">single select</text><line x1="574" y1="518" x2="976" y2="518" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="580" y="540" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">research_gaps</text><text x="970" y="540" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">long text</text><line x1="574" y1="552" x2="976" y2="552" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="580" y="574" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">last_updated_at</text><text x="970" y="574" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">datetime</text><line x1="574" y1="586" x2="976" y2="586" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="580" y="608" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">created_at</text><text x="970" y="608" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">datetime</text><rect x="1040" y="150" width="380" height="280" rx="14" fill="#FFFBF1" stroke="#251f12" stroke-width="2.5"/><path d="M 1040 164 q 0 -14 14 -14 h 352 q 14 0 14 14 v 48 h -380 Z" fill="#251f12"/><text x="1230.0" y="180" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="19" fill="#FFFBF1" text-anchor="middle">Lead_Research_Events</text><text x="1230.0" y="200" font-family="Manrope, sans-serif" font-size="12" fill="#FFFBF1" text-anchor="middle" opacity="0.85">polymorphic audit trail — one row per agent event</text><rect x="1048" y="216" width="364" height="28" rx="6" fill="#E17100" opacity="0.13"/><text x="1060" y="234" font-family="JetBrains Mono, monospace" font-weight="700" font-size="13.5" fill="#E17100" text-anchor="start">event_id</text><text x="1400" y="234" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">text — PK</text><line x1="1054" y1="246" x2="1406" y2="246" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="1060" y="268" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">lead_id</text><text x="1400" y="268" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">text — FK</text><line x1="1054" y1="280" x2="1406" y2="280" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="1060" y="302" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">agent_name</text><text x="1400" y="302" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">single select</text><line x1="1054" y1="314" x2="1406" y2="314" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="1060" y="336" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">event_type</text><text x="1400" y="336" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">single select</text><line x1="1054" y1="348" x2="1406" y2="348" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="1060" y="370" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">payload</text><text x="1400" y="370" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">long text</text><line x1="1054" y1="382" x2="1406" y2="382" stroke="#251f12" stroke-width="0.75" opacity="0.25"/><text x="1060" y="404" font-family="JetBrains Mono, monospace" font-weight="400" font-size="13.5" fill="#251f12" text-anchor="start">recorded_at</text><text x="1400" y="404" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="end">datetime</text><line x1="510" y1="330" x2="560" y2="330" stroke="#251f12" stroke-width="2.5" marker-end="url(#arrowhead)"/><text x="535" y="315.0" font-family="Manrope, sans-serif" font-weight="500" font-size="12" fill="#5c5439" text-anchor="middle">lead_id</text><line x1="990" y1="330" x2="1040" y2="330" stroke="#251f12" stroke-width="2.5" marker-end="url(#arrowhead)"/><text x="1015" y="315.0" font-family="Manrope, sans-serif" font-weight="500" font-size="12" fill="#5c5439" text-anchor="middle">lead_id</text><text x="750.0" y="750.0" font-family="Manrope, sans-serif" font-weight="700" font-size="15" fill="#E17100" text-anchor="middle">all three tables key on the same identifier: the lead's LinkedIn URL</text><rect x="80" y="800" width="1340" height="340" rx="16" fill="none" stroke="#251f12" stroke-width="1.5" opacity="0.5"/><text x="130" y="840.0" font-family="Manrope, sans-serif" font-weight="700" font-size="17" fill="#E17100" text-anchor="start">WHY THREE TABLES, NOT ONE WIDE ONE</text><text x="130" y="872.0" font-family="Manrope, sans-serif" font-weight="700" font-size="14.5" fill="#E17100" text-anchor="start">Lead_Profiles</text><text x="130" y="894.0" font-family="Manrope, sans-serif" font-weight="500" font-size="14.5" fill="#251f12" text-anchor="start">Captured the moment a lead is sourced — independent of whether that lead ever finishes the pipeline. This is the</text><text x="130" y="916.0" font-family="Manrope, sans-serif" font-weight="500" font-size="14.5" fill="#251f12" text-anchor="start">durable identity directory, kept in its own table so it survives even when pipeline_status resets.</text><text x="130" y="950.0" font-family="Manrope, sans-serif" font-weight="700" font-size="14.5" fill="#E17100" text-anchor="start">Leads</text><text x="130" y="972.0" font-family="Manrope, sans-serif" font-weight="500" font-size="14.5" fill="#251f12" text-anchor="start">The checkpoint table the workflow actually reads on every run. pipeline_status is the resume mechanism — the Airtable —</text><text x="130" y="994.0" font-family="Manrope, sans-serif" font-weight="500" font-size="14.5" fill="#251f12" text-anchor="start">Get Completed Leads node filters on this exact field so a re-run never re-processes or re-emails a finished lead.</text><text x="130" y="1028.0" font-family="Manrope, sans-serif" font-weight="700" font-size="14.5" fill="#E17100" text-anchor="start">Lead_Research_Events</text><text x="130" y="1050.0" font-family="Manrope, sans-serif" font-weight="500" font-size="14.5" fill="#251f12" text-anchor="start">A polymorphic log, not a fixed schema — every agent (Research, Synthesis, Generator, Critic) writes its own event</text><text x="130" y="1072.0" font-family="Manrope, sans-serif" font-weight="500" font-size="14.5" fill="#251f12" text-anchor="start">type here (draft, critique, research_finding) with a JSON payload — the schema doesn't change when the process does.</text><text x="130" y="1110.0" font-family="Manrope, sans-serif" font-weight="500" font-size="14.5" fill="#251f12" text-anchor="start">personalization_tier and research_gaps on Leads exist for one reason: so a human scanning ready_to_send can catch a</text><text x="130" y="1132.0" font-family="Manrope, sans-serif" font-weight="500" font-size="14.5" fill="#251f12" text-anchor="start">fabricated or thin personalization before anything reaches an inbox — the audit trail is worthless if nobody reads it.</text><text x="1410" y="1225" font-family="JetBrains Mono, monospace" font-size="13" fill="#5c5439" text-anchor="end">Airtable data layer · Groundwork</text></svg>