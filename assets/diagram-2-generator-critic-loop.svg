<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1750" width="1500" height="1750" font-family="Manrope, sans-serif"><rect x="0" y="0" width="1500" height="1750" fill="#FFFBF1"/><defs>
<marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#251f12"/></marker>
<marker id="arrowhead-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#E17100"/></marker>
</defs><text x="750.0" y="55.0" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="28" fill="#251f12" text-anchor="middle">THE BOUNDED GENERATOR-CRITIC LOOP</text><text x="750.0" y="86.0" font-family="Manrope, sans-serif" font-weight="500" font-size="15" fill="#5c5439" text-anchor="middle" font-style="italic">why a second model — not a bigger one — is what makes the draft trustworthy</text><rect x="600" y="130" width="300" height="80" rx="14" fill="#FFFBF1" stroke="#251f12" stroke-width="2.5"/><text x="750.0" y="167.20000000000002" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="18" fill="#251f12" text-anchor="middle">Personalization Brief</text><text x="750.0" y="196.0" font-family="JetBrains Mono, monospace" font-size="13" fill="#5c5439" text-anchor="middle">from Synthesis Agent</text><line x1="750" y1="210" x2="750" y2="270" stroke="#251f12" stroke-width="2.5" marker-end="url(#arrowhead)"/><rect x="600" y="270" width="300" height="70" rx="14" fill="#FFFBF1" stroke="#E17100" stroke-width="3"/><text x="750.0" y="302.2" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="18" fill="#251f12" text-anchor="middle">SMYKM Agent</text><text x="750.0" y="326.0" font-family="JetBrains Mono, monospace" font-size="13" fill="#5c5439" text-anchor="middle">round = 1</text><line x1="750" y1="340" x2="750" y2="400" stroke="#251f12" stroke-width="2.5" marker-end="url(#arrowhead)"/><rect x="280" y="400" width="340" height="110" rx="14" fill="#FFFBF1" stroke="#251f12" stroke-width="2.5"/><text x="450.0" y="433.34" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="18" fill="#251f12" text-anchor="middle">Generator Agent</text><text x="450.0" y="455.84" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="18" fill="#251f12" text-anchor="middle">"The Writer"</text><text x="450.0" y="481.0" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">Claude Sonnet 4.6 · drafts subject + body</text><text x="450.0" y="496.0" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">from Brief (+ prior feedback on round 2)</text><path d="M 750 340 Q 650 370 450 400" fill="none" stroke="#251f12" stroke-width="2.5" marker-end="url(#arrowhead)"/><path d="M 450 400 Q 500 370 620 340" fill="none" stroke="#E17100" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrowhead-amber)"/><rect x="280" y="570" width="340" height="130" rx="14" fill="#FFFBF1" stroke="#251f12" stroke-width="2.5" stroke-dasharray="8,6"/><text x="450.0" y="605.21" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="17" fill="#251f12" text-anchor="middle">Layer 0 / 1 checks</text><text x="450.0" y="626.46" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="17" fill="#251f12" text-anchor="middle">(deterministic, no model)</text><text x="450.0" y="656.0" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">word count · banned-phrase scan ·</text><text x="450.0" y="671.0" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">subject length · placeholder / fabrication</text><text x="450.0" y="686.0" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">string match against the Brief</text><line x1="450" y1="510" x2="450" y2="570" stroke="#251f12" stroke-width="2.5" marker-end="url(#arrowhead)"/><polygon points="450,710.0 580.0,760 450,810.0 320.0,760" fill="#FFFBF1" stroke="#E17100" stroke-width="2.5"/><text x="450" y="755.95" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="15" fill="#251f12" text-anchor="middle">Passes</text><text x="450" y="773.95" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="15" fill="#251f12" text-anchor="middle">Layer 0/1?</text><line x1="450" y1="700" x2="450" y2="710" stroke="#251f12" stroke-width="2.5" marker-end="url(#arrowhead)"/><rect x="150" y="850" width="300" height="90" rx="14" fill="#FFFBF1" stroke="#251f12" stroke-width="2.5" stroke-dasharray="8,6"/><text x="300.0" y="890.95" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="15" fill="#5c5439" text-anchor="middle">Reject — regenerate</text><text x="300.0" y="909.7" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="15" fill="#5c5439" text-anchor="middle">(does not consume a round)</text><line x1="360" y1="800" x2="250" y2="850" stroke="#251f12" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrowhead)"/><path d="M 250 850 Q 150 650 400 480" fill="none" stroke="#251f12" stroke-width="2.5" marker-end="url(#arrowhead)"/><rect x="900" y="400" width="340" height="110" rx="14" fill="#FFFBF1" stroke="#251f12" stroke-width="2.5"/><text x="1070.0" y="433.34" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="18" fill="#251f12" text-anchor="middle">Critic Agent</text><text x="1070.0" y="455.84" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="18" fill="#251f12" text-anchor="middle">"The Judge"</text><text x="1070.0" y="481.0" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">Gemini 3.5 Flash · scores draft on the</text><text x="1070.0" y="496.0" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">6-dimension SMYKM rubric vs. the Brief</text><path d="M 560 800 Q 750 600 900 460" fill="none" stroke="#251f12" stroke-width="2.5" marker-end="url(#arrowhead)"/><text x="760" y="630.0" font-family="Manrope, sans-serif" font-weight="500" font-size="13" fill="#5c5439" text-anchor="middle" font-style="italic">on Layer 0/1 pass</text><rect x="900" y="570" width="340" height="140" rx="14" fill="#FFFBF1" stroke="#251f12" stroke-width="2.5" stroke-dasharray="8,6"/><text x="1070.0" y="620.75" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="17" fill="#251f12" text-anchor="middle">6-dimension rubric</text><text x="1070.0" y="666.0" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">grounding · subject line · opener compliance ·</text><text x="1070.0" y="681.0" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">structure · persona specificity · soft CTA</text><text x="1070.0" y="696.0" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">each dimension: evidence + score</text><line x1="1070" y1="510" x2="1070" y2="570" stroke="#251f12" stroke-width="2.5" marker-end="url(#arrowhead)"/><polygon points="1070,725.0 1210.0,780 1070,835.0 930.0,780" fill="#FFFBF1" stroke="#E17100" stroke-width="2.5"/><text x="1070" y="775.95" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="15" fill="#251f12" text-anchor="middle">Overall</text><text x="1070" y="793.95" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="15" fill="#251f12" text-anchor="middle">verdict?</text><line x1="1070" y1="710" x2="1070" y2="725" stroke="#251f12" stroke-width="2.5" marker-end="url(#arrowhead)"/><rect x="1150" y="900" width="300" height="90" rx="14" fill="#FFFBF1" stroke="#E17100" stroke-width="3"/><text x="1300.0" y="933.8" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="20" fill="#251f12" text-anchor="middle">PASS</text><text x="1300.0" y="959.75" font-family="JetBrains Mono, monospace" font-size="13" fill="#5c5439" text-anchor="middle">→ FINALIZE</text><text x="1300.0" y="976.0" font-family="JetBrains Mono, monospace" font-size="13" fill="#5c5439" text-anchor="middle">write to Leads table</text><path d="M 1180 835 Q 1230 865 1250 900" fill="none" stroke="#251f12" stroke-width="2.5" marker-end="url(#arrowhead)"/><polygon points="700,945.0 840.0,1000 700,1055.0 560.0,1000" fill="#FFFBF1" stroke="#E17100" stroke-width="2.5"/><text x="700" y="995.95" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="15" fill="#251f12" text-anchor="middle">round &lt; 2</text><text x="700" y="1013.95" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="15" fill="#251f12" text-anchor="middle">and not knockout?</text><path d="M 950 835 Q 880 900 800 1000" fill="none" stroke="#251f12" stroke-width="2.5" marker-end="url(#arrowhead)"/><text x="880" y="970.0" font-family="Manrope, sans-serif" font-weight="700" font-size="14" fill="#E17100" text-anchor="middle">FAIL</text><path d="M 560 1000 Q 300 1050 450 460" fill="none" stroke="#E17100" stroke-width="2.5" marker-end="url(#arrowhead)"/><text x="360" y="1060.0" font-family="Manrope, sans-serif" font-weight="600" font-size="13" fill="#E17100" text-anchor="middle">round += 1 · feedback</text><text x="360" y="1076.9" font-family="Manrope, sans-serif" font-weight="600" font-size="13" fill="#E17100" text-anchor="middle">attached to next Generator call</text><rect x="560" y="1100" width="340" height="100" rx="14" fill="#FFFBF1" stroke="#251f12" stroke-width="2.5" stroke-dasharray="8,6"/><text x="730.0" y="1139.15" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="17" fill="#251f12" text-anchor="middle">Knockout rule</text><text x="730.0" y="1171.0" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">fabricated personal fact OR unsafe /</text><text x="730.0" y="1186.0" font-family="JetBrains Mono, monospace" font-size="12" fill="#5c5439" text-anchor="middle">off-brand claim → skip straight here</text><line x1="700" y1="1055" x2="700" y2="1100" stroke="#251f12" stroke-width="2.5" marker-end="url(#arrowhead)"/><rect x="560" y="1250" width="340" height="100" rx="14" fill="#FFFBF1" stroke="#E17100" stroke-width="3"/><text x="730.0" y="1288.8" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="20" fill="#251f12" text-anchor="middle">ESCALATE</text><text x="730.0" y="1319.75" font-family="JetBrains Mono, monospace" font-size="13" fill="#5c5439" text-anchor="middle">→ needs_manual_review</text><text x="730.0" y="1336.0" font-family="JetBrains Mono, monospace" font-size="13" fill="#5c5439" text-anchor="middle">full draft + feedback trail preserved</text><line x1="700" y1="1200" x2="700" y2="1250" stroke="#251f12" stroke-width="2.5" marker-end="url(#arrowhead)"/><path d="M 700 1055 Q 900 1150 700 1250" fill="none" stroke="#251f12" stroke-width="2.5" marker-end="url(#arrowhead)"/><text x="900" y="1160" font-family="Manrope, sans-serif" font-size="13" fill="#E17100" text-anchor="middle" font-weight="600">round = 2, still failing</text><rect x="150" y="1420" width="1200" height="230" rx="16" fill="none" stroke="#251f12" stroke-width="1.5" opacity="0.5"/><text x="210" y="1458.0" font-family="Manrope, sans-serif" font-weight="700" font-size="16" fill="#E17100" text-anchor="start">WHY TWO ROUNDS, NOT AN OPEN LOOP</text><text x="210" y="1490.0" font-family="Manrope, sans-serif" font-weight="500" font-size="14" fill="#251f12" text-anchor="start">Self-Refine (Madaan et al.) shows ~20% absolute improvement over 2-4 iterations, with most of the</text><text x="210" y="1514.0" font-family="Manrope, sans-serif" font-weight="500" font-size="14" fill="#251f12" text-anchor="start">gain landing in the first pass or two — extra rounds buy diminishing quality for real token cost.</text><text x="210" y="1546.0" font-family="Manrope, sans-serif" font-weight="500" font-size="14" fill="#251f12" text-anchor="start">Huang et al. (ICLR 2024) found LLMs cannot reliably self-correct without external feedback — hence a</text><text x="210" y="1570.0" font-family="Manrope, sans-serif" font-weight="500" font-size="14" fill="#251f12" text-anchor="start">separate Critic model, not the Writer grading its own homework.</text><text x="210" y="1602.0" font-family="Manrope, sans-serif" font-weight="500" font-size="14" fill="#251f12" text-anchor="start">The Critic runs on Gemini, the Writer on Claude — different labs, different training data, different failure</text><text x="210" y="1626.0" font-family="Manrope, sans-serif" font-weight="500" font-size="14" fill="#251f12" text-anchor="start">modes. Same-family critique tends to rate its own family's output 75-84% favorably (UXBench, 2026).</text><text x="1410" y="1725" font-family="JetBrains Mono, monospace" font-size="13" fill="#5c5439" text-anchor="end">SMYKM Agent orchestration · n8n agentTool pattern · Groundwork</text></svg>